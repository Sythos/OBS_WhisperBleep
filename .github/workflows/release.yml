name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version tag
    if: github.event.created == true && github.event.deleted == false && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Validate new semver tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CREATED: ${{ github.event.created }}
          DELETED: ${{ github.event.deleted }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          if [[ "$CREATED" != "true" || "$DELETED" == "true" || "$FORCED" == "true" ]]; then
            echo "Only a newly created, non-forced version tag can create a release." >&2
            exit 1
          fi

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use bare MAJOR.MINOR.PATCH semver." >&2
            exit 1
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG" != "$version" ]]; then
            echo "Tag $TAG does not match VERSION $version." >&2
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "A GitHub release already exists for tag $TAG." >&2
            exit 1
          fi

          latest_published="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | select(.draft == false) | .tag_name][0] // empty')"
          if [[ "$latest_published" == "$TAG" ]]; then
            echo "Tag $TAG is already the latest published release." >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build release packages
    needs: validate
    uses: ./.github/workflows/build-test.yml
    permissions:
      contents: read

  publish:
    name: Create draft release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Download release packages
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: OBS-WhisperBleep-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and create checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "release-assets/OBS-WhisperBleep-${VERSION}-Windows-x64.zip"
            "release-assets/OBS-WhisperBleep-${VERSION}-Linux-x86_64.tar.gz"
            "release-assets/OBS-WhisperBleep-${VERSION}-macOS-universal.tar.gz"
          )
          for asset in "${expected[@]}"; do
            test -s "$asset"
          done

          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l)"
          if [[ "$asset_count" -ne 3 ]]; then
            echo "Unexpected files in release-assets:" >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi

          forbidden="$(find release-assets -type f \( \
            -iname '*.bin' -o -iname '*.gguf' -o -iname '*.onnx' -o \
            -iname '*.pt' -o -iname '*.pth' -o -iname '*.ckpt' -o \
            -iname '*.pkl' -o -iname '*.pickle' -o -iname '*.safetensors' -o \
            -path '*/model-cache/*' -o -path '*/models/*' -o \
            -path '*/weights/*' -o -path '*/__pycache__/*' -o \
            -iname '.env' -o -iname '*.pem' -o -iname '*.p12' -o \
            -iname '*.pfx' -o -iname '*.key' -o -iname 'id_rsa' -o \
            -iname 'id_ed25519' -o -iname '*credentials*' -o -iname '*secret*' \
          \))"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden model/cache file in release assets:" >&2
            echo "$forbidden" >&2
            exit 1
          fi

          for asset in "${expected[@]}"; do
            if [[ "$asset" == *.zip ]]; then
              manifest="$(unzip -Z1 "$asset")"
            else
              manifest="$(tar -tzf "$asset")"
            fi
            unsafe="$(printf '%s\n' "$manifest" | grep -E '(^|/)\.\.(/|$)|(^|/)(\.env|.*\.(pem|p12|pfx|key))$|(^|/)(model-cache|models|weights|__pycache__)(/|$)' || true)"
            if [[ -n "$unsafe" ]]; then
              echo "Unsafe path in release asset $asset:" >&2
              echo "$unsafe" >&2
              exit 1
            fi
          done

          (
            cd release-assets
            sha256sum *.zip *.tar.gz > SHA256SUMS
          )

      - name: Create draft GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "A GitHub release already exists for tag ${TAG}." >&2
            exit 1
          fi

          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "OBS WhisperBleep ${TAG}" \
            --notes "Multi-platform OBS WhisperBleep ${TAG} build. Review the assets and publish the draft release when approved." \
            release-assets/*
