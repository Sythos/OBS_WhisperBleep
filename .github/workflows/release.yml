name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version tag
    if: github.event.created == true && github.event.deleted == false && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Validate new semver tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CREATED: ${{ github.event.created }}
          DELETED: ${{ github.event.deleted }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          if [[ "$CREATED" != "true" || "$DELETED" == "true" || "$FORCED" == "true" ]]; then
            echo "Only a newly created, non-forced version tag can create a release." >&2
            exit 1
          fi

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use MAJOR.MINOR.PATCH with an optional prerelease suffix." >&2
            exit 1
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          base_tag="${TAG%%-*}"
          if [[ "$base_tag" != "$version" ]]; then
            echo "Tag $TAG does not match VERSION $version." >&2
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "A GitHub release already exists for tag $TAG." >&2
            exit 1
          fi

          latest_published="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | select(.draft == false) | .tag_name][0] // empty')"
          if [[ "$latest_published" == "$TAG" ]]; then
            echo "Tag $TAG is already the latest published release." >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build release packages
    needs: validate
    uses: ./.github/workflows/package.yml
    with:
      native_obs: true
    permissions:
      contents: read

  container:
    name: Publish runtime container
    needs: validate
    uses: ./.github/workflows/container.yml
    with:
      version: ${{ needs.validate.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
  publish:
    name: Publish latest release
    needs:
      - validate
      - build
      - container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Download release packages
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: OBS-WhisperBleep-*
          path: release-assets
          merge-multiple: true

      - name: Install package inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends p7zip-full

      - name: Verify release assets and create checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "release-assets/OBS-WhisperBleep-${VERSION}-Windows-x64-unsigned.exe"
            "release-assets/OBS-WhisperBleep-${VERSION}-Linux-x86_64.tar.gz"
            "release-assets/OBS-WhisperBleep-${VERSION}-Linux-x86_64.deb"
            "release-assets/OBS-WhisperBleep-${VERSION}-macOS-universal.tar.gz"
          )
          for asset in "${expected[@]}"; do
            test -s "$asset"
          done

          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l)"
          if [[ "$asset_count" -ne 4 ]]; then
            echo "Unexpected files in release-assets:" >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi

          forbidden="$(find release-assets -type f \( \
            -iname '*.bin' -o -iname '*.gguf' -o -iname '*.onnx' -o \
            -iname '*.pt' -o -iname '*.pth' -o -iname '*.ckpt' -o \
            -iname '*.pkl' -o -iname '*.pickle' -o -iname '*.safetensors' -o \
            -path '*/model-cache/*' -o -path '*/models/*' -o \
            -path '*/weights/*' -o -path '*/__pycache__/*' -o \
            -iname '.env' -o -iname '*.pem' -o -iname '*.p12' -o \
            -iname '*.pfx' -o -iname '*.key' -o -iname 'id_rsa' -o \
            -iname 'id_ed25519' -o -iname '*credentials*' -o -iname '*secret*' \
          \))"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden model/cache file in release assets:" >&2
            echo "$forbidden" >&2
            exit 1
          fi

          for asset in "${expected[@]}"; do
            case "$asset" in
              *.exe)
                manifest="$(7z l -slt "$asset" | sed -n 's/^Path = //p')"
                ;;
              *.tar.gz)
                manifest="$(tar -tzf "$asset")"
                ;;
              *.deb)
                manifest="$(dpkg-deb --fsys-tarfile "$asset" | tar -t)"
                ;;
              *)
                echo "Unsupported release asset: $asset" >&2
                exit 1
                ;;
            esac
            unsafe="$(printf '%s\n' "$manifest" | grep -E -i '(^|/)\.\.(/|$)|(^|/)(\.env|id_(rsa|ed25519)|[^/]*\.(bin|gguf|onnx|pt|pth|ckpt|pkl|pickle|safetensors|pem|p12|pfx|key))$|(^|/)(model-cache|models|weights|__pycache__)(/|$)|(^|/)[^/]*(credentials|secret|token|password)[^/]*$' || true)"
            if [[ -n "$unsafe" ]]; then
              echo "Unsafe path in release asset $asset:" >&2
              echo "$unsafe" >&2
              exit 1
            fi
          done

          (
            cd release-assets
            sha256sum *.exe *.tar.gz *.deb > SHA256SUMS
          )

      - name: Publish latest GitHub release with generated notes
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "A GitHub release already exists for tag ${TAG}." >&2
            exit 1
          fi

          gh release create "$TAG" \
            --verify-tag \
            --latest \
            --generate-notes \
            --title "OBS WhisperBleep ${TAG}" \
            --notes "Installer release ${TAG}. Linux and Windows payloads are native OBS plugin builds against the pinned OBS libobs SDK; the Linux DEB targets Ubuntu 26.04 LTS amd64 and declares the Python/Whisper runtime prerequisites. A CPU runtime container is published at ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/obs-whisperbleep-runtime:${TAG}. The macOS payload is an unsigned universal portable stub. Whisper model weights are not bundled. Use as-is." \
            release-assets/*
